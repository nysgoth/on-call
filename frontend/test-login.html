<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .result { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Login Test</h1>
    <button onclick="testLogin()">Test Login</button>
    <button onclick="clearStorage()">Clear Storage</button>
    <div id="result"></div>
    
    <script>
        const API_BASE_URL = 'http://localhost:8000';
        
        async function testLogin() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="result">Testing...</div>';
            
            try {
                console.log('Testing login...');
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        username: 'engineer1', 
                        password: 'engineer123' 
                    }),
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                if (!response.ok) {
                    const text = await response.text();
                    resultDiv.innerHTML = `<div class="result error">
                        <strong>Error ${response.status}:</strong><br>
                        ${text}
                    </div>`;
                    return;
                }
                
                const data = await response.json();
                console.log('Login data:', data);
                
                // Store token
                sessionStorage.setItem('authToken', data.access_token);
                sessionStorage.setItem('currentUser', JSON.stringify(data.user));
                
                resultDiv.innerHTML = `<div class="result success">
                    <strong>Success!</strong><br>
                    Token: ${data.access_token.substring(0, 50)}...<br>
                    User: ${data.user.username} (${data.user.role})<br>
                    <button onclick="testAuth()">Test Auth</button>
                </div>`;
                
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `<div class="result error">
                    <strong>Exception:</strong><br>
                    ${error.message}
                </div>`;
            }
        }
        
        async function testAuth() {
            const resultDiv = document.getElementById('result');
            const token = sessionStorage.getItem('authToken');
            
            if (!token) {
                resultDiv.innerHTML = '<div class="result error">No token found!</div>';
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/auth/me`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    resultDiv.innerHTML = `<div class="result error">Auth failed: ${response.status}</div>`;
                    return;
                }
                
                const data = await response.json();
                resultDiv.innerHTML = `<div class="result success">
                    <strong>Auth Success!</strong><br>
                    User: ${data.username} (${data.role})
                </div>`;
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">Auth error: ${error.message}</div>`;
            }
        }
        
        function clearStorage() {
            sessionStorage.clear();
            document.getElementById('result').innerHTML = '<div class="result">Storage cleared!</div>';
        }
        
        // Auto test on load
        window.addEventListener('load', () => {
            console.log('Page loaded, checking storage...');
            const token = sessionStorage.getItem('authToken');
            const user = sessionStorage.getItem('currentUser');
            console.log('Token:', !!token, 'User:', !!user);
        });
    </script>
</body>
</html>
